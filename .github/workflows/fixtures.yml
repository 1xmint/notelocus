# A check that genuinely skips.
#
# The `paths:` filter means this workflow does not run at all for a pull request
# that leaves `tests/fixtures/` alone. GitHub still reports a check run for a
# required workflow that was filtered out, with conclusion `skipped` — which is
# the conclusion GitLocus's evidence collector handles in code and, by its own
# comment, has never seen:
#
#   `skipped` was previously in PASSING. It was harmless only because nothing in
#   this repository is ever skipped
#
# Whether the fix works is the second thing this repository measures.
name: fixtures

on:
  pull_request:
    paths:
      - "tests/fixtures/**"

permissions:
  contents: read

jobs:
  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip pytest
          python -m pytest
