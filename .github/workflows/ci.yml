# The checks this repository runs.
#
# Deliberately a different shape from the repository whose gate is being tested
# here: four checks rather than fifteen, different names, and one that is
# path-filtered so it *skips* on most pull requests. A gate that has only ever
# seen one repository's CI has only ever been tested against one repository's CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: python -m ruff check .

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: python -m ruff format --check .

  # Path-filtered at the *workflow* level below, in `fixtures.yml`.
  #
  # An earlier version of this job used a step-level `if:`, which produces a job
  # that runs and succeeds with every step skipped - conclusion `success`, not
  # `skipped`. That tested nothing. A conclusion of `skipped` needs the job
  # itself never to start, which means either a job-level `if:` that is false or
  # a workflow whose path filter does not match.
